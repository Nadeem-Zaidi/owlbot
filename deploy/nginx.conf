# Load balancer in front of the API replicas (docker-compose.prod.yml).
worker_processes auto;
events { worker_connections 8192; }

http {
    # Docker's DNS: re-resolve "api" so scaled replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 100m;          # document uploads
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain;   # never text/event-stream (streams must flush)
    gzip_min_length 1024;

    log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s upstream=${upstream_addr}';
    access_log /var/log/nginx/access.log main;

    upstream api  { zone api 64k;  server api:3000 resolve;  keepalive 128; }
    upstream jobs { zone jobs 64k; server jobs:3000 resolve; keepalive 16; }

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;

        # Streaming replies (SSE): no buffering, long reads.
        location = /api/chat_stream {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            add_header X-Accel-Buffering no;
        }

        # WhatsApp lives on the single "jobs" instance (it holds the login session).
        location /api/whatsapp/ {
            proxy_pass http://jobs;
        }

        location = /healthz { proxy_pass http://api; access_log off; }

        location / {
            proxy_pass http://api;
        }
    }
}
